; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino

monitor_speed = 115200
build_flags = -std=gnu++11 -I include

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Production build: no status/activity LED updates. The hardware power LED
; remains connected directly to 3V3 and is not software-controllable.
[env:seeed_xiao_production]
extends = env:seeed_xiao
build_flags = -std=gnu++11 -I include -D UKIYO_DEBUG_LEDS=0
