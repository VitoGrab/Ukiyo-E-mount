[platformio]
default_envs = seeed_xiao

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao]
extra_scripts = post:tools/platformio_upload_wait.py
platform = atmelsam
; BOSSA 1.7 cannot erase individual rows during a write. Use the
; PlatformIO-supported 1.9 series with explicit application offset.
platform_packages = platformio/tool-bossac@~1.10900.0
board = seeed_xiao
board_build.ldscript = linker/xiao_profile_flash.ld
board_upload.maximum_size = 245760
framework = arduino

monitor_speed = 115200
build_flags = -std=gnu++11 -I include -I include/emount -DUKIYO_NO_FLASH_LOG=1 -DUKIYO_PROFILE_FLASH=1

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Production build: no status/activity LED updates. The hardware power LED
; remains connected directly to 3V3 and is not software-controllable.
[env:seeed_xiao_production]
extends = env:seeed_xiao
build_flags = -std=gnu++11 -I include -I include/emount -DUKIYO_NO_FLASH_LOG=1 -DUKIYO_PROFILE_FLASH=1 -D UKIYO_DEBUG_LEDS=0
